{% extends "base.html" %}
{% block title %}Issue Book - Library Management System{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Issue Book</h1>
  <p class="page-subtitle">Issue a book to a registered member</p>
</div>

<div class="form-card">
  <form id="issueForm" class="stacked-form">
    <div class="form-row">
      <label for="memberSelect">Member *</label>
      <select id="memberSelect" name="member_id" required>
        <option value="">-- Select a member --</option>
      </select>
    </div>
    <div class="form-row">
      <label for="bookSelect">Book *</label>
      <select id="bookSelect" name="book_id" required>
        <option value="">-- Select a book --</option>
      </select>
      <small id="bookAvailabilityHint" class="field-hint"></small>
    </div>
    <div class="form-row">
      <label for="issueDate">Issue Date *</label>
      <input type="date" id="issueDate" name="issue_date" required>
    </div>
    <div class="form-row">
      <label for="dueDate">Due Date *</label>
      <input type="date" id="dueDate" name="due_date" required>
    </div>
    <div class="modal-actions">
      <button type="submit" class="btn btn-primary">Issue Book</button>
    </div>
  </form>
</div>

<h2 class="section-title">Currently Issued Books</h2>
<div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr>
        <th>Txn ID</th>
        <th>Book</th>
        <th>Member</th>
        <th>Issue Date</th>
        <th>Due Date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="issuedTableBody">
      <tr><td colspan="6" class="empty-row">Loading...</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/issue.js') }}"></script>
{% endblock %}
