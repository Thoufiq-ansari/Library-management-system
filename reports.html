{% extends "base.html" %}
{% block title %}Reports - Library Management System{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Reports</h1>
  <p class="page-subtitle">Browse library records</p>
</div>

<div class="tabs" id="reportTabs">
  <button class="tab-btn active" data-report="books">All Books</button>
  <button class="tab-btn" data-report="available">Available Books</button>
  <button class="tab-btn" data-report="issued">Issued Books</button>
  <button class="tab-btn" data-report="overdue">Overdue Books</button>
  <button class="tab-btn" data-report="members">Members</button>
  <button class="tab-btn" data-report="history">Issue/Return History</button>
</div>

<div class="table-wrap">
  <table class="data-table" id="reportTable">
    <thead id="reportTableHead"></thead>
    <tbody id="reportTableBody">
      <tr><td class="empty-row">Loading...</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/reports.js') }}"></script>
{% endblock %}
