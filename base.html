<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Library Management System{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">

  <!-- Mobile top bar -->
  <header class="topbar">
    <button id="menuToggle" class="icon-btn" aria-label="Toggle menu">&#9776;</button>
    <span class="topbar-title">Library Management System</span>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">&#128218;</span>
      <span class="brand-text">LibrarySys</span>
    </div>
    <ul class="nav-list">
      <li><a href="{{ url_for('dashboard') }}" class="nav-link {{ 'active' if request.endpoint == 'dashboard' }}">&#128202; Dashboard</a></li>
      <li><a href="{{ url_for('books_page') }}" class="nav-link {{ 'active' if request.endpoint == 'books_page' }}">&#128214; Books</a></li>
      <li><a href="{{ url_for('members_page') }}" class="nav-link {{ 'active' if request.endpoint == 'members_page' }}">&#128101; Members</a></li>
      <li><a href="{{ url_for('issue_page') }}" class="nav-link {{ 'active' if request.endpoint == 'issue_page' }}">&#128228; Issue Book</a></li>
      <li><a href="{{ url_for('return_page') }}" class="nav-link {{ 'active' if request.endpoint == 'return_page' }}">&#128229; Return Book</a></li>
      <li><a href="{{ url_for('reports_page') }}" class="nav-link {{ 'active' if request.endpoint == 'reports_page' }}">&#128203; Reports</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="sidebar-user">Signed in as<br><strong>{{ username }}</strong></div>
      <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
    </div>
  </nav>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- Main content -->
  <main class="main-content">
    <div id="alertBox" class="alert-box hidden"></div>
    {% block content %}{% endblock %}
  </main>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
